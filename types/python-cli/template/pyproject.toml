[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "{{NAME}}"
description = "{{NAME}}: a command-line tool"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]

[project.scripts]
"{{NAME}}" = "{{NAME_SNAKE}}.cli:main"

[tool.setuptools.dynamic]
version = { attr = "{{NAME_SNAKE}}.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
